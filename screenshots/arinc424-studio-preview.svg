    <line x1="620" y1="167" x2="720" y2="167" stroke="#FFF" stroke-dasharray="4,4" />
    <text x="730" y="172" font-family="monospace" font-size="11" font-weight="bold" fill="#00E5FF">RW12L (13,123 ft)</text>

    <!-- Leg 1: DB410 [IF] -->
    <circle cx="80" cy="70" r="6" fill="#00E5FF" />
    <text x="80" y="55" font-family="monospace" font-size="11" font-weight="bold" fill="#00E5FF" text-anchor="middle">DB410 [IF]</text>
    <text x="80" y="90" font-family="monospace" font-size="9" fill="#8E9CAE" text-anchor="middle">+4,000' / 220K</text>

    <line x1="86" y1="70" x2="260" y2="70" stroke="#00B4D8" stroke-width="2.5" />

    <!-- Leg 2: DB420 [TF] -->
    <circle cx="260" cy="70" r="6" fill="#00E5FF" />
    <text x="260" y="55" font-family="monospace" font-size="11" font-weight="bold" fill="#00E5FF" text-anchor="middle">DB420 [TF]</text>
    <text x="260" y="90" font-family="monospace" font-size="9" fill="#8E9CAE" text-anchor="middle">+3,000' / -210K</text>

    <!-- Leg 3: RF Curved Arc to DB430 -->
    <path d="M 260,70 A 150,150 0 0,1 460,150" fill="none" stroke="#FF2A85" stroke-width="3.5" stroke-dasharray="6,3" />
    <text x="380" y="95" font-family="monospace" font-size="12" font-weight="bold" fill="#FF2A85">RF CURVED ARC (R=3.5 NM)</text>

    <!-- Fix DB430 [RF] -->
    <circle cx="460" cy="150" r="6" fill="#00E676" />
    <text x="460" y="135" font-family="monospace" font-size="11" font-weight="bold" fill="#00E676" text-anchor="middle">DB430 [RF / FAF]</text>
    <text x="460" y="170" font-family="monospace" font-size="9" fill="#8E9CAE" text-anchor="middle">+2,000' / -210K</text>

    <!-- Final Leg to Runway -->
    <line x1="466" y1="150" x2="620" y2="167" stroke="#00E676" stroke-width="2.5" />
    <text x="540" y="152" font-family="monospace" font-size="10" fill="#00E676">CF (Course 122°)</text>
  </g>

  <!-- 10-Point Normative Auditor Table -->
  <g transform="translate(400, 545)">
    <rect width="780" height="230" rx="8" fill="url(#cardGrad)" stroke="#1F2D42" />
    <text x="20" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#00E5FF">10-Point Normative ARINC 424 / DO-200B Compliance Audit</text>
