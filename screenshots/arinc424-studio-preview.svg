    <g transform="translate(20, 42)" font-family="monospace" font-size="9">
      <text y="14" fill="#00E5FF" font-weight="bold">RULE_01</text>
      <text x="70" y="14" fill="#E2E8F0">ARINC 424 Section 2.1: Strict 132-Column Fixed-Width Record Length</text>
      <text x="660" y="14" fill="#00E676" font-weight="bold">● PASSED</text>

      <text y="30" fill="#00E5FF" font-weight="bold">RULE_02</text>
      <text x="70" y="30" fill="#E2E8F0">ARINC 424 Section 4.1: Section Code Hierarchy (D NAVAID, PA Airport, PF Apch)</text>
      <text x="660" y="30" fill="#00E676" font-weight="bold">● PASSED</text>

      <text y="46" fill="#00E5FF" font-weight="bold">RULE_03</text>
      <text x="70" y="46" fill="#E2E8F0">ARINC 424 Section 5.13: Hemispheric Coordinates [N|S]DDMMSSss Precision</text>
      <text x="660" y="46" fill="#00E676" font-weight="bold">● PASSED</text>

      <text y="62" fill="#00E5FF" font-weight="bold">RULE_04</text>
      <text x="70" y="62" fill="#E2E8F0">ARINC 424 Section 5.21: 23 Path Terminator Taxonomy (IF, TF, CF, DF, RF)</text>
      <text x="660" y="62" fill="#00E676" font-weight="bold">● PASSED</text>

      <text y="78" fill="#00E5FF" font-weight="bold">RULE_05</text>
      <text x="70" y="78" fill="#E2E8F0">RTCA DO-236C / ARINC 424: Constant Radius Arc (RF Leg) Parameterization</text>
      <text x="660" y="78" fill="#00E676" font-weight="bold">● PASSED</text>

      <text y="94" fill="#00E5FF" font-weight="bold">RULE_06</text>
      <text x="70" y="94" fill="#E2E8F0">ARINC 424 Section 5.29: Altitude Description Codes (+ At/Above, - Below, B Window)</text>
      <text x="660" y="94" fill="#00E676" font-weight="bold">● PASSED</text>

      <text y="110" fill="#00E5FF" font-weight="bold">RULE_07</text>
      <text x="70" y="110" fill="#E2E8F0">ARINC 424 Section 5.261: Speed Restriction Formatting (-210 Knots Maximum)</text>
      <text x="660" y="110" fill="#00E676" font-weight="bold">● PASSED</text>

      <text y="126" fill="#00E5FF" font-weight="bold">RULE_08</text>
      <text x="70" y="126" fill="#E2E8F0">ARINC 424 Section 4.1.7: Airport Primary Record Integrity &amp; Elevation</text>
      <text x="660" y="126" fill="#00E676" font-weight="bold">● PASSED</text>

      <text y="142" fill="#00E5FF" font-weight="bold">RULE_09</text>
      <text x="70" y="142" fill="#E2E8F0">ARINC 424 Section 4.1.2: VHF NAVAID Frequency Word (115.70 MHz -> 11570)</text>
      <text x="660" y="142" fill="#00E676" font-weight="bold">● PASSED</text>

      <text y="158" fill="#00E5FF" font-weight="bold">RULE_10</text>
      <text x="70" y="158" fill="#E2E8F0">RTCA DO-200B Section 2.4: Aeronautical Data Integrity &amp; 32-Bit CRC Checksum</text>
      <text x="660" y="158" fill="#00E676" font-weight="bold">● PASSED</text>
    </g>
  </g>
</svg>