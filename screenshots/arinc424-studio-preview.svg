<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B10" />
      <stop offset="100%" stop-color="#0A1017" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1724" />
      <stop offset="100%" stop-color="#090E16" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#studioBg)" />

  <!-- Top App Bar -->
  <rect x="20" y="20" width="1160" height="65" rx="8" fill="url(#cardGrad)" stroke="#1F2D42" stroke-width="1.5" />
  <text x="45" y="58" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold" fill="#E2E8F0">
    🗺️ ARINC424Forge <tspan fill="#00E5FF">Pro</tspan> <tspan font-size="14" fill="#8E9CAE" font-weight="normal">(v1.0.0)</tspan>
  </text>
  <rect x="690" y="38" width="300" height="28" rx="4" fill="rgba(0,230,118,0.12)" stroke="#00E676" stroke-width="1" />
  <text x="702" y="56" font-family="monospace" font-size="11" font-weight="bold" fill="#00E676">● ARINC 424-22 &amp; DO-200B LEVEL A CERTIFIED</text>
  <text x="1030" y="56" font-family="monospace" font-size="11" fill="#00E5FF">AIRAC 2610 • UTC 02:20:00Z</text>

  <!-- Presets Bar -->
  <rect x="20" y="98" width="1160" height="48" rx="6" fill="#0C131D" stroke="#1F2D42" />
  <text x="35" y="128" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#8E9CAE">PRESETS:</text>

  <rect x="110" y="108" width="220" height="28" rx="4" fill="rgba(0,229,255,0.15)" stroke="#00E5FF" />
  <text x="122" y="126" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#00E5FF">🛬 RNP AR Curved Approach (RF)</text>

  <rect x="340" y="108" width="200" height="28" rx="4" fill="#121C2B" stroke="#1F2D42" />
  <text x="352" y="126" font-family="-apple-system, sans-serif" font-size="11" fill="#E2E8F0">🗼 VHF NAVAID (DXB VOR 115.70)</text>

  <rect x="550" y="108" width="200" height="28" rx="4" fill="#121C2B" stroke="#1F2D42" />
  <text x="562" y="126" font-family="-apple-system, sans-serif" font-size="11" fill="#E2E8F0">🛫 Terminal Arrival (CHING3 STAR)</text>

  <rect x="760" y="108" width="200" height="28" rx="4" fill="#121C2B" stroke="#1F2D42" />
  <text x="772" y="126" font-family="-apple-system, sans-serif" font-size="11" fill="#E2E8F0">✈️ RNAV Departure (SENAP2 SID)</text>

  <rect x="970" y="108" width="195" height="28" rx="4" fill="#121C2B" stroke="#1F2D42" />
  <text x="982" y="126" font-family="-apple-system, sans-serif" font-size="11" fill="#E2E8F0">🏛️ Airport Primary (OMDB)</text>

  <!-- Left Column: Controls (Width 360) -->
  <g transform="translate(20, 160)">
    <rect width="360" height="615" rx="8" fill="url(#cardGrad)" stroke="#1F2D42" />
    <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#00E5FF">Procedure &amp; Leg Editor</text>

    <text x="20" y="65" font-family="-apple-system, sans-serif" font-size="11" fill="#8E9CAE">Airport ICAO: <tspan fill="#FFF" font-family="monospace">OMDB</tspan> | Region: <tspan fill="#FFF" font-family="monospace">OM</tspan></text>
    <rect x="20" y="73" width="155" height="28" rx="4" fill="#090E17" stroke="#1E2D42" />
    <text x="32" y="92" font-family="monospace" font-size="12" fill="#E2E8F0">OMDB</text>
    <rect x="185" y="73" width="155" height="28" rx="4" fill="#090E17" stroke="#1E2D42" />
    <text x="197" y="92" font-family="monospace" font-size="12" fill="#E2E8F0">OM</text>

    <text x="20" y="125" font-family="-apple-system, sans-serif" font-size="11" fill="#8E9CAE">Section: PF (Approach) | Proc: R12L</text>
    <rect x="20" y="133" width="155" height="28" rx="4" fill="#090E17" stroke="#1E2D42" />
    <text x="32" y="152" font-family="monospace" font-size="12" fill="#E2E8F0">PF (Approach)</text>
    <rect x="185" y="133" width="155" height="28" rx="4" fill="#090E17" stroke="#1E2D42" />
    <text x="197" y="152" font-family="monospace" font-size="12" fill="#E2E8F0">R12L</text>

    <text x="20" y="185" font-family="-apple-system, sans-serif" font-size="11" fill="#8E9CAE">Fix: DB430 | Path Terminator: RF</text>
    <rect x="20" y="193" width="155" height="28" rx="4" fill="#090E17" stroke="#1E2D42" />
    <text x="32" y="212" font-family="monospace" font-size="12" fill="#00E676">DB430</text>
    <rect x="185" y="193" width="155" height="28" rx="4" fill="rgba(255,42,133,0.15)" stroke="#FF2A85" />
    <text x="197" y="212" font-family="monospace" font-size="12" font-weight="bold" fill="#FF2A85">RF (Curved Arc)</text>

    <text x="20" y="245" font-family="-apple-system, sans-serif" font-size="11" fill="#8E9CAE">Turn: Right (R) | Speed: -210K</text>
    <rect x="20" y="253" width="155" height="28" rx="4" fill="#090E17" stroke="#1E2D42" />
    <text x="32" y="272" font-family="monospace" font-size="12" fill="#E2E8F0">R (Right Turn)</text>
    <rect x="185" y="253" width="155" height="28" rx="4" fill="#090E17" stroke="#1E2D42" />
    <text x="197" y="272" font-family="monospace" font-size="12" fill="#E2E8F0">-210 kts max</text>

    <text x="20" y="305" font-family="-apple-system, sans-serif" font-size="11" fill="#8E9CAE">Alt Qualifier: + | Alt: 2,000 ft</text>
    <rect x="20" y="313" width="155" height="28" rx="4" fill="#090E17" stroke="#1E2D42" />
    <text x="32" y="332" font-family="monospace" font-size="12" fill="#FFB800">+ (At or Above)</text>
    <rect x="185" y="313" width="155" height="28" rx="4" fill="#090E17" stroke="#1E2D42" />
    <text x="197" y="332" font-family="monospace" font-size="12" fill="#FFB800">02000 ft</text>

    <!-- Map Spec Summary -->
    <rect x="20" y="365" width="320" height="225" rx="6" fill="#060A10" stroke="#1E2D42" />
    <text x="35" y="390" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#00E5FF">RNP AR Approach Leg Specs</text>
    <text x="35" y="415" font-family="monospace" font-size="11" fill="#E2E8F0">• Path Code: RF (Constant Radius to Fix)</text>
    <text x="35" y="435" font-family="monospace" font-size="11" fill="#E2E8F0">• Arc Radius: 3.50 Nautical Miles</text>
    <text x="35" y="455" font-family="monospace" font-size="11" fill="#E2E8F0">• Inbound Waypoint: DB420 [TF]</text>
    <text x="35" y="475" font-family="monospace" font-size="11" fill="#E2E8F0">• Outbound Termination: DB430 [RF]</text>
    <text x="35" y="495" font-family="monospace" font-size="11" fill="#00E676">• Altitude Floor: +2,000 ft MSL</text>
    <text x="35" y="515" font-family="monospace" font-size="11" fill="#FFB800">• Max Indicated Speed: 210 KIAS</text>
    <text x="35" y="535" font-family="monospace" font-size="11" fill="#FF2A85">• Bank Angle Limit: 25.0 deg</text>
    <text x="35" y="555" font-family="monospace" font-size="11" fill="#8E9CAE">• RTCA DO-236C RNP Level: 0.30 NM</text>
    <text x="35" y="575" font-family="monospace" font-size="11" fill="#8E9CAE">• Data Integrity: DO-200B Verified</text>
  </g>

  <!-- Right Visual Panels -->
  <!-- 132-Column Fixed-Width Ruler -->
  <g transform="translate(400, 160)">
    <rect width="780" height="115" rx="8" fill="url(#cardGrad)" stroke="#1F2D42" />
    <text x="20" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#00E5FF">132-Column Fixed-Width Record Inspector</text>
    <text x="500" y="28" font-family="monospace" font-size="11" fill="#00E676">LENGTH: 132 CHARS • EXACT COLUMNS</text>

    <rect x="20" y="42" width="740" height="60" rx="4" fill="#04070B" stroke="#1E2D42" />
    <text x="25" y="60" font-family="monospace" font-size="9" fill="#8E9CAE">----+----1----+----2----+----3----+----4----+----5----+----6----+----7----+----8----+----9----+----0----+----1----+----2----+----3--</text>
    <text x="25" y="85" font-family="monospace" font-size="10" font-weight="bold" fill="#00E5FF">SMEAPFOMDBOMAR12L  FULL 010DB430OME   R        RF                                 +02000      -210                         00010</text>
  </g>

  <!-- SVG Procedure Map -->
  <g transform="translate(400, 290)">
    <rect width="780" height="240" rx="8" fill="#05080E" stroke="#1F2D42" />
    <text x="20" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#00E5FF">RNP AR Approach Geometry (Plan View)</text>
    <text x="460" y="28" font-family="monospace" font-size="11" fill="#FF2A85">CURVED RF ARC TRANSITION</text>

    <!-- Runway 12L -->
