<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B10" />
      <stop offset="100%" stop-color="#0E1726" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121C2B" />
      <stop offset="100%" stop-color="#0D1522" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="url(#bgGrad)" />

  <!-- Title Banner -->
  <rect x="30" y="25" width="940" height="60" rx="8" fill="url(#panelGrad)" stroke="#1F2D42" stroke-width="1.5" />
  <text x="50" y="62" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="#E2E8F0">
    ARINC424Forge Pro (v1.0.0) — Navigation System Database Architecture
  </text>
  <text x="680" y="61" font-family="monospace" font-size="12" fill="#00E5FF">
    ARINC 424-22 • RTCA DO-200B • RTCA DO-236C
  </text>

  <!-- Left Block: 132-Column ARINC 424 Master Database -->
  <g transform="translate(30, 110)" filter="url(#shadow)">
    <rect width="270" height="490" rx="8" fill="url(#panelGrad)" stroke="#1F2D42" stroke-width="1.5" />
    <text x="20" y="35" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" fill="#00E5FF">1. 132-Col Database Records</text>
    <line x1="20" y1="48" x2="250" y2="48" stroke="#1F2D42" stroke-width="1" />

    <rect x="15" y="65" width="240" height="65" rx="4" fill="#090E17" stroke="#1B283A" />
    <text x="25" y="88" font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0">VHF NAVAID (Section D)</text>
    <text x="25" y="104" font-family="monospace" font-size="10" fill="#8E9CAE">VOR, DME, TACAN, VORTAC</text>
    <text x="25" y="118" font-family="monospace" font-size="10" fill="#00E5FF">Freq, Coordinates, Elevation, MagVar</text>

    <rect x="15" y="145" width="240" height="65" rx="4" fill="#090E17" stroke="#1B283A" />
    <text x="25" y="168" font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0">Airport &amp; Runway (Section P)</text>
    <text x="25" y="184" font-family="monospace" font-size="10" fill="#8E9CAE">PA: Ref Point, Elevation, Trans Alt</text>
    <text x="25" y="198" font-family="monospace" font-size="10" fill="#00E676">PG: Runway Length, True/Mag Bearing</text>

    <rect x="15" y="225" width="240" height="65" rx="4" fill="#090E17" stroke="#1B283A" />
    <text x="25" y="248" font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0">En-route Fixes &amp; Airways</text>
    <text x="25" y="264" font-family="monospace" font-size="10" fill="#8E9CAE">EA: 5-Letter Named Waypoints</text>
    <text x="25" y="278" font-family="monospace" font-size="10" fill="#8E9CAE">ER: Jet &amp; Victor Airway Segments</text>

    <rect x="15" y="305" width="240" height="65" rx="4" fill="#090E17" stroke="#1B283A" />
    <text x="25" y="328" font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0">Terminal Procedures</text>
    <text x="25" y="344" font-family="monospace" font-size="10" fill="#8E9CAE">PD: Standard Departure (SID)</text>
    <text x="25" y="358" font-family="monospace" font-size="10" fill="#8E9CAE">PE: Standard Terminal Arrival (STAR)</text>

    <rect x="15" y="385" width="240" height="75" rx="4" fill="#090E17" stroke="#1B283A" />
    <text x="25" y="408" font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0">Instrument Approaches (PF)</text>
    <text x="25" y="424" font-family="monospace" font-size="10" fill="#8E9CAE">ILS, RNAV / RNP, VOR, NDB</text>
    <text x="25" y="438" font-family="monospace" font-size="10" fill="#FFB800">IAF -> IF -> FAF -> MAP -> Missed</text>
  </g>

  <!-- Center Block: ARINC 424 Path Terminator Geometry Engine -->
  <g transform="translate(330, 110)" filter="url(#shadow)">
    <rect width="340" height="490" rx="8" fill="url(#panelGrad)" stroke="#1F2D42" stroke-width="1.5" />
    <text x="20" y="35" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" fill="#00E5FF">2. Path Terminator Engine</text>
    <line x1="20" y1="48" x2="320" y2="48" stroke="#1F2D42" stroke-width="1" />

    <!-- Sub-kernel A: 23 Leg Types -->
    <rect x="15" y="60" width="310" height="195" rx="6" fill="#090E17" stroke="#00B4D8" stroke-width="1" />
    <text x="25" y="85" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#00B4D8">ARINC 424 Leg Classification</text>
    <text x="25" y="108" font-family="monospace" font-size="10" fill="#E2E8F0">• IF: Initial Fix (Procedure Entry)</text>
    <text x="25" y="126" font-family="monospace" font-size="10" fill="#E2E8F0">• TF: Track to a Fix (Great Circle Track)</text>
    <text x="25" y="144" font-family="monospace" font-size="10" fill="#E2E8F0">• CF: Course to a Fix (Inbound Course)</text>
    <text x="25" y="162" font-family="monospace" font-size="10" fill="#E2E8F0">• DF: Direct to a Fix (Direct Turn)</text>
    <text x="25" y="180" font-family="monospace" font-size="10" fill="#FF2A85">• RF: Constant Radius Arc (RNP AR Curve)</text>
    <text x="25" y="198" font-family="monospace" font-size="10" fill="#E2E8F0">• HA / HF / HM: Holding Patterns</text>

    <!-- Sub-kernel B: Constraints & Integrity -->
    <rect x="15" y="270" width="310" height="205" rx="6" fill="#090E17" stroke="#FFB800" stroke-width="1" />
    <text x="25" y="295" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#FFB800">DO-200B Quality &amp; Constraints</text>
    <text x="25" y="318" font-family="monospace" font-size="10" fill="#E2E8F0">• Altitude Descriptions: (+ / - / B / at)</text>
    <text x="25" y="336" font-family="monospace" font-size="10" fill="#E2E8F0">• Speed Restrictions: (-210, 250, etc.)</text>
    <text x="25" y="354" font-family="monospace" font-size="10" fill="#E2E8F0">• Hemispheric Coordinates: [N|S]DDMMSSss</text>
    <text x="25" y="372" font-family="monospace" font-size="10" fill="#E2E8F0">• Sub-second Precision (&lt; 0.0001 deg)</text>
    <text x="25" y="390" font-family="monospace" font-size="10" fill="#E2E8F0">• IEEE 802.3 32-Bit CRC Data Integrity</text>
    <text x="25" y="408" font-family="monospace" font-size="10" fill="#E2E8F0">• AIRAC 28-Day Cycle Alignment</text>
  </g>

  <!-- Right Block: FMS Ingestion & Navigation Display -->
  <g transform="translate(700, 110)" filter="url(#shadow)">
    <rect width="270" height="490" rx="8" fill="url(#panelGrad)" stroke="#1F2D42" stroke-width="1.5" />
    <text x="20" y="35" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" fill="#00E5FF">3. FMS &amp; EFIS Targets</text>
    <line x1="20" y1="48" x2="250" y2="48" stroke="#1F2D42" stroke-width="1" />

    <rect x="15" y="65" width="240" height="70" rx="4" fill="#090E17" stroke="#00E676" stroke-width="1.5" />
    <text x="25" y="88" font-family="monospace" font-size="11" font-weight="bold" fill="#00E676">FMS Navigation Engines</text>
    <text x="25" y="106" font-family="monospace" font-size="10" fill="#E2E8F0">Honeywell Pegasus / Epic / NG</text>
    <text x="25" y="122" font-family="monospace" font-size="10" fill="#8E9CAE">Collins Pro Line 21 &amp; Fusion</text>

    <rect x="15" y="150" width="240" height="70" rx="4" fill="#090E17" stroke="#00B4D8" stroke-width="1.5" />
    <text x="25" y="173" font-family="monospace" font-size="11" font-weight="bold" fill="#00B4D8">Integrated Cockpit Suites</text>
    <text x="25" y="191" font-family="monospace" font-size="10" fill="#E2E8F0">Garmin G1000 / G3000 / G5000</text>
    <text x="25" y="207" font-family="monospace" font-size="10" fill="#8E9CAE">Thales TopFlight FMS (Airbus)</text>

    <rect x="15" y="235" width="240" height="70" rx="4" fill="#090E17" stroke="#FFB800" stroke-width="1.5" />
    <text x="25" y="258" font-family="monospace" font-size="11" font-weight="bold" fill="#FFB800">Aero Data Providers</text>
    <text x="25" y="276" font-family="monospace" font-size="10" fill="#E2E8F0">Jeppesen (Boeing Digital)</text>
    <text x="25" y="292" font-family="monospace" font-size="10" fill="#8E9CAE">Lufthansa Systems LIDO &amp; Navblue</text>

    <rect x="15" y="320" width="240" height="70" rx="4" fill="#090E17" stroke="#00E5FF" stroke-width="1.5" />
    <text x="25" y="343" font-family="monospace" font-size="11" font-weight="bold" fill="#00E5FF">Autonomous UAS &amp; eVTOL</text>
    <text x="25" y="361" font-family="monospace" font-size="10" fill="#E2E8F0">Joby, Archer, Skydio, Volocopter</text>
    <text x="25" y="377" font-family="monospace" font-size="10" fill="#8E9CAE">DO-178C DAL-A Autopilot Integration</text>

    <rect x="15" y="405" width="240" height="65" rx="4" fill="#090E17" stroke="#E2E8F0" stroke-width="1" />
    <text x="25" y="428" font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0">Flight Simulation Platforms</text>
    <text x="25" y="446" font-family="monospace" font-size="10" fill="#8E9CAE">CAE &amp; FlightSafety Level-D Simulators</text>
    <text x="25" y="460" font-family="monospace" font-size="10" fill="#8E9CAE">MSFS / Navigraph Database Engines</text>
  </g>

  <!-- Connective Arrows -->
  <line x1="300" y1="230" x2="330" y2="230" stroke="#00B4D8" stroke-width="2" />
  <polygon points="328,226 336,230 328,234" fill="#00B4D8" />

  <line x1="300" y1="410" x2="330" y2="410" stroke="#FFB800" stroke-width="2" />
  <polygon points="328,406 336,410 328,414" fill="#FFB800" />

  <line x1="670" y1="210" x2="700" y2="210" stroke="#00E676" stroke-width="2" />
  <polygon points="698,206 706,210 698,214" fill="#00E676" />

  <line x1="670" y1="370" x2="700" y2="370" stroke="#00E5FF" stroke-width="2" />
  <polygon points="698,366 706,370 698,374" fill="#00E5FF" />
</svg>